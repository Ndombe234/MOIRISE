verification_rule:
  "A worker handoff is never sufficient by itself. The coordinator must verify the exact integrated commit against the relevant PLAN + TECHNICAL_DESIGN pair and the applicable transversal contracts."

negative_rule:
  "Do not create duplicate module plans, duplicate AI architecture, provider registries, alternative DONE definitions, or a second memory/brain/router authority in .codex/."
