version: 1
purpose: "Machine-readable coverage registry for the canonical fabrication documents. It adds orchestration metadata only; it does not redefine module behavior."

read_policy:
  module_task:
    required:
      - PLAN.md
      - TECHNICAL_DESIGN.md
    rule: "PLAN defines WHAT; TECHNICAL_DESIGN defines HOW. A worker may not fabricate a module task from only one of the pair."
  ai_task:
    required:
      - docs/moirise/ai/AI_MASTER_PLAN.md
      - docs/moirise/ai/AI_TECHNICAL_DESIGN.md
    rule: "AI_MASTER_PLAN defines WHAT; AI_TECHNICAL_DESIGN defines HOW. No third AI authority."
  cross_module_task:
    required: "All directly affected module pairs plus the AI pair when M15/capabilities/providers/workers are involved."
  change_impact:
    required:
      - docs/moirise/transversal/DEPENDENCIES.md
      - docs/moirise/transversal/CONTRACTS.md
      - docs/moirise/transversal/DEFINITION_OF_DONE.md
    rule: "Shared-contract changes require dependency impact before dependent workers resume."

